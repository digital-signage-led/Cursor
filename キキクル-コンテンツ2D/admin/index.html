<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>③ 危険度 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-app">
    <header class="admin-bar">
      <h1>③ 危険度 管理</h1>
      <label class="bar-field">都道府県
        <select id="pref"></select>
      </label>
      <label class="bar-field">コンテンツ
        <select id="type">
          <option value="land">土砂キキクル</option>
          <option value="inundation">浸水キキクル</option>
          <option value="flood">洪水キキクル</option>
        </select>
      </label>
      <div class="admin-actions">
        <button type="button" id="preview" class="ghost">プレビュー更新</button>
        <button type="button" id="copy-url" class="ghost">公開URLコピー</button>
        <button type="button" id="save">設定保存</button>
        <button type="button" id="load" class="ghost">設定読込</button>
        <button type="button" id="reset" class="ghost">初期値</button>
        <button type="button" id="open-url" class="warn">本番URLを開く</button>
      </div>
    </header>

    <section class="admin-controls">
      <label class="check"><input type="checkbox" id="showTitle" checked> タイトル</label>
      <label class="check"><input type="checkbox" id="showPrefName" checked> 都道府県名</label>
      <label class="check"><input type="checkbox" id="showLegend" checked> 凡例</label>
      <label class="check"><input type="checkbox" id="showUpdated" checked> 更新時刻</label>
      <label class="check"><input type="checkbox" id="showHeader" checked> ヘッダー</label>
      <label class="check"><input type="checkbox" id="showPanel" checked> 情報パネル</label>
    </section>

    <section class="admin-urls">
      <h2>公開URL一覧（47都道府県 × 土砂/浸水/洪水）</h2>
      <div class="filters">
        <input id="url-pref" type="text" placeholder="都道府県検索">
        <strong id="url-count">141 / 141</strong>
      </div>
      <div class="url-wrap">
        <table>
          <thead>
            <tr><th>都道府県</th><th>コンテンツ</th><th>公開URL</th><th></th></tr>
          </thead>
          <tbody id="url-table"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-preview" aria-label="プレビュー">
      <iframe id="preview-frame" title="キキクルプレビュー"></iframe>
    </section>
  </div>
  <div id="toast" hidden></div>
  <script src="../js/config.js?v=pref5"></script>
  <script src="../js/prefectures.js?v=pref5"></script>
  <script src="../js/admin.js?v=pref6"></script>
</body>
</html>
